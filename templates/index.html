<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App CRUD Flask MongoDB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="container">
        <h1 class="text-center mt-5 mb-5">APP API-REST PYTHON - FLASK - MONGODB</h1>
    </div>

    <div class="container">
        <div class="row">

            <!-- Formulario de alta -->
            <div class="col-md-4 mb-3">
                <div class="card">
                    <div class="card-header">
                        <h5 class="text-center">Alta producto</h5>
                    </div>
                    <div class="card-body">
                        <form action="/products" method="POST">
                            <label>Nombre</label>
                            <input type="text" class="form-control mb-3" name="name">
                            <label>Precio</label>
                            <input type="text" class="form-control mb-3" name="price">
                            <label>Cantidad</label>
                            <input type="text" class="form-control mb-3" name="quantity">
                            <button class="btn btn-primary" type="submit">Guardar</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Lista de productos -->
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h5 class="text-center">Productos</h5>
                    </div>
                    <div class="card-body">
                        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3">
                            {% for product in products %}
                            <div class="col mb-3">
                                <div class="list-group-item">
                                    <form action="{{ url_for('edit', product_name=product.name) }}" method="POST">
                                        <small>NOMBRE</small>
                                        <input type="text" class="form-control" value="{{ product.name }}" name="name">
                                        <small>CANTIDAD</small>
                                        <input type="text" class="form-control" value="{{ product.quantity }}" name="quantity">
                                        <small>PRECIO</small>
                                        <input type="text" class="form-control" value="{{ product.price }}" name="price">
                                        <button class="btn btn-primary btn-sm mt-3" type="submit">Editar</button>
                                        <a href="{{ url_for('delete', product_name=product.name) }}" class="btn btn-danger btn-sm mt-3">Eliminar</a>
                                    </form>
                                </div>
                            </div>
                            {% endfor %}
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
